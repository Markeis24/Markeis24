name: Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Markeis24
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#39C5BB&color_dots=#0D1117,#164A47,#227A73,#39C5BB,#71E5DC

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
