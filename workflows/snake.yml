name: Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Markeis24
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff0000&color_dots=#0d1117,#161b22,#262c36,#ff0000,#ff4d4d

      - uses: actions/upload-artifact@v3
        with:
          name: snake
          path: github-contribution-grid-snake.svg
